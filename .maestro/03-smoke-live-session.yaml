# Flow: Home → Live Session → Start → Finish → Session Log
#
# Prerequisites:
#   - User must be logged in and onboarding completed.
#   - UV forecast must be available (location granted and forecast loaded).
#     Without UV data the live session screen shows an error state — see note below.
#
# Note on UV requirement:
#   Live Session requires a UV forecast. If location is denied or UV fetch fails,
#   the screen shows "Necesitamos el índice UV" and a back button. This is expected
#   and tested separately in 05-smoke-resilience-uv-unavailable.yaml.
#
# Expected outcome:
#   - Timer starts, runs for a few seconds, pauses, then finishes.
#   - Session Log screen opens prefilled with elapsed time and SPF.

appId: com.bronzeiq.app
---
# Navigate to Live Session from Home
- tapOn:
    id: 'home-live-session-button'

# Confirm the live session screen loaded
- assertVisible: 'Empezar'

# Start the session
- tapOn:
    id: 'live-session-control'

# Wait a moment for the timer to tick
- waitForAnimationToEnd

# Pause
- tapOn:
    id: 'live-session-control'

# Finish and proceed to Session Log
- tapOn:
    id: 'live-session-finish'

# Should land on Session Log prefilled with elapsed time
- assertVisible: 'Registrar exposición'
